<text x="580" y="174" font-size="12" fill="#ffffff" text-anchor="end" font-weight="normal">GPIO16 (RX2)</text>
<circle cx="590" cy="194" r="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
<text x="580" y="198" font-size="12" fill="#ffffff" text-anchor="end" font-weight="normal">GPIO17 (TX2)</text>
<circle cx="590" cy="218" r="5" fill="#fff" stroke="#212529" stroke-width="2"/>
<text x="580" y="222" font-size="12" fill="#ffffff" text-anchor="end" font-weight="normal">GND</text>
<text x="475" y="254" font-size="11" fill="#c7ccd4" text-anchor="middle" font-weight="normal">powered by its USB</text>
<polyline points="420,270 420,340" fill="none" stroke="#8a94a3" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="435" y="330" font-size="11" fill="#5b6573" text-anchor="start" font-weight="normal">USB: 5 V charger or PC</text>
<rect x="700" y="40" width="230" height="300" rx="12" fill="#f8f9fa" stroke="#3d4a5c" stroke-width="2"/>
<text x="815" y="64" font-size="14" fill="#1d2430" text-anchor="middle" font-weight="700">NUCLEO-C051C8</text>
<text x="815" y="84" font-size="10" fill="#5b6573" text-anchor="middle" font-weight="normal">ESCOPE_UART_ID = ESCOPE_UART_BRIDGE</text>
<rect x="745" y="230" width="140" height="80" rx="6" fill="#2b2f36" stroke="#2b2f36" stroke-width="2"/>
<text x="815" y="268" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">STM32C051C8</text>
<text x="815" y="286" font-size="11" fill="#c7ccd4" text-anchor="middle" font-weight="normal">USART1</text>
<circle cx="700" cy="170" r="5" fill="#fff" stroke="#d9480f" stroke-width="2"/>
<text x="710" y="174" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">PB6 (USART1_TX)</text>
<circle cx="700" cy="194" r="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
<text x="710" y="198" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">PB7 (USART1_RX)</text>
<circle cx="700" cy="218" r="5" fill="#fff" stroke="#212529" stroke-width="2"/>
<text x="710" y="222" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">GND</text>
<polyline points="695,170 595,170" fill="none" stroke="#d9480f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ad9480f)"/>
<polyline points="595,194 695,194" fill="none" stroke="#1971c2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a1971c2)"/>
<polyline points="595,218 695,218" fill="none" stroke="#212529" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="815" y="330" font-size="10" fill="#5b6573" text-anchor="middle" font-weight="normal">USB CN1: power / flash</text>
<polyline points="30,230 60,230" fill="none" stroke="#d9480f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="68" y="234" font-size="11" fill="#5b6573" text-anchor="start" font-weight="normal">PB6 TX → GPIO16 RX2</text>
<polyline points="30,250 60,250" fill="none" stroke="#1971c2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="68" y="254" font-size="11" fill="#5b6573" text-anchor="start" font-weight="normal">GPIO17 TX2 → PB7 RX</text>
<polyline points="30,270 60,270" fill="none" stroke="#212529" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="68" y="274" font-size="11" fill="#5b6573" text-anchor="start" font-weight="normal">common ground (required)</text>
<polyline points="30,290 60,290" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="68" y="294" font-size="11" fill="#5b6573" text-anchor="start" font-weight="normal">wireless link</text>
<rect x="30" y="380" width="900" height="66" rx="8" fill="#fff8e1" stroke="#e6b800" stroke-width="1.5"/>
<text x="42" y="402" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">Only 3 wires: TX and RX crossed + GND. Both boards use 3.3 V logic: no level shifter.</text>
<text x="42" y="419" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">PB6 / PB7: find the pins on the ST morpho header silkscreen (tables in user manual UM2953).</text>
<text x="42" y="436" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">USART2 (PA2 / PA3) stays connected to the ST-LINK: do not use it for the bridge.</text>
</svg>
