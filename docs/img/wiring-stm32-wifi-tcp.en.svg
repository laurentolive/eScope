<text x="135.0" y="172" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">Windows PC</text>
<text x="135.0" y="208" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal" font-style="italic">same network as the ESP32</text>
