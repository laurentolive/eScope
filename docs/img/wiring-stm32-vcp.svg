<rect x="30" y="325" width="820" height="48" rx="8" fill="#fff8e1" stroke="#e6b800" stroke-width="1.5"/>
<text x="42" y="347" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">Aucun fil à ajouter : USART2 (PA2 / PA3) est relié au ST-LINK par les ponts SB27 / SB32 (fermés d&#x27;usine).</text>
<text x="42" y="364" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">Le même câble alimente la carte, la programme et transporte la liaison eScope.</text>
