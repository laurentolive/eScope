<text x="42" y="322" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">No wire: the ST-LINK probe reads and writes the RTT buffers in RAM while the program runs, without a UART.</text>
<text x="42" y="339" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">Throughput is no longer limited by a 115200 baud UART: 1 ms sampling (ESCOPE_SAMPLING_MS = 1).</text>
