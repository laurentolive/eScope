<rect x="45" y="85" width="180" height="88" rx="6" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
<text x="135.0" y="82" font-size="1" fill="#1d2430" text-anchor="start" font-weight="normal"></text>
<text x="135.0" y="112" font-size="13" fill="#1d2430" text-anchor="middle" font-weight="700">eScope</text>
<text x="135.0" y="130" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">Device “Nano”</text>
<text x="135.0" y="148" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">Serial COMx, 115200</text>
<text x="135.0" y="202" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">Windows PC</text>
<text x="135.0" y="238" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal" font-style="italic">COMx port (CH340 / FT232)</text>
<polyline points="240,145 440,145" fill="none" stroke="#8a94a3" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="301.6" y="118" width="76.8" height="18" rx="9" fill="#fff" stroke="#8a94a3" stroke-width="1.5"/>
<text x="340.0" y="132" font-size="11" fill="#8a94a3" text-anchor="middle" font-weight="600">USB cable</text>
<rect x="440" y="50" width="410" height="200" rx="12" fill="#1c5fa8" stroke="#0f3d6e" stroke-width="2"/>
<text x="645" y="76" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Arduino Nano (ATmega328P)</text>
<rect x="460" y="110" width="130" height="80" rx="6" fill="#e8eef7" stroke="#0f3d6e" stroke-width="1.5"/>
<text x="525" y="146" font-size="12" fill="#1d2430" text-anchor="middle" font-weight="600">USB ↔ serial</text>
<text x="525" y="164" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">CH340 / FT232</text>
<rect x="700" y="110" width="130" height="80" rx="6" fill="#2b2f36" stroke="#000000" stroke-width="2"/>
<text x="765" y="146" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ATmega328P</text>
<text x="765" y="164" font-size="11" fill="#c7ccd4" text-anchor="middle" font-weight="normal">Serial (UART0)</text>
<polyline points="592,135 696,135" fill="none" stroke="#ffd8a8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#affd8a8)"/>
<polyline points="696,165 592,165" fill="none" stroke="#a5d8ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aa5d8ff)"/>
<text x="644" y="128" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">D0 (RX)</text>
<text x="644" y="183" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">D1 (TX)</text>
<text x="645" y="228" font-size="11" fill="#c7d6ea" text-anchor="middle" font-weight="normal" font-style="italic">wired on the board</text>
<rect x="30" y="270" width="820" height="48" rx="8" fill="#fff8e1" stroke="#e6b800" stroke-width="1.5"/>
<text x="42" y="292" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">No wire to add: the serial link goes through the programming USB cable. Connect nothing to D0 / D1,</text>
<text x="42" y="309" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">and close the Arduino IDE serial monitor before recording in eScope (one program per COM port).</text>
</svg>
