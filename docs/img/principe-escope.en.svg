<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How eScope works: the PC sends addresses, the firmware sends back raw memory">
<title>How eScope works: the PC sends addresses, the firmware sends back raw memory</title>
<defs><marker id="a212529" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker><marker id="s212529" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker><marker id="a2f9e44" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="s2f9e44" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="a7048e8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="s7048e8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="ac92a2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="sc92a2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="a5b6573" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker><marker id="s5b6573" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker><marker id="ad9480f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="sd9480f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="a1d2430" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><marker id="s1d2430" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><marker id="a8a94a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/></marker><marker id="s8a94a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/></marker><marker id="a1971c2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="s1971c2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="40" width="280" height="200" rx="10" fill="#eef2f7" stroke="#3d4a5c" stroke-width="2"/>
<text x="170" y="66" font-size="14" fill="#1d2430" text-anchor="middle" font-weight="700">PC — eScope</text>
<text x="50" y="100" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">1. reads the .elf (GDB) or the .map</text>
<text x="50" y="124" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">2. name → address + size</text>
<text x="50" y="148" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">4. plots the received values</text>
<text x="50" y="172" font-size="12" fill="#1d2430" text-anchor="start" font-weight="normal">   (one frame per period)</text>
<rect x="590" y="40" width="280" height="200" rx="10" fill="#2b2f36" stroke="#2b2f36" stroke-width="2"/>
<text x="730" y="66" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Microcontroller</text>
<text x="610" y="100" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="normal">module eScopeProtocol (V3)</text>
<text x="610" y="124" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="normal">eScopeProtocol_Process()</text>
<text x="610" y="148" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="normal">every “Sampling Time” ms:</text>
<text x="610" y="172" font-size="12" fill="#e9ecef" text-anchor="start" font-weight="normal">3. copies the requested RAM</text>
<polyline points="315,110 585,110" fill="none" stroke="#1971c2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a1971c2)"/>
<rect x="339.6" y="85" width="220.8" height="18" rx="9" fill="#fff" stroke="#1971c2" stroke-width="1.5"/>
<text x="450" y="99" font-size="11" fill="#1971c2" text-anchor="middle" font-weight="600">addresses + sizes (once)</text>
<polyline points="585,180 315,180" fill="none" stroke="#d9480f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ad9480f)"/>
<rect x="346.8" y="155" width="206.4" height="18" rx="9" fill="#fff" stroke="#d9480f" stroke-width="1.5"/>
<text x="450" y="169" font-size="11" fill="#d9480f" text-anchor="middle" font-weight="600">raw values (continuously)</text>
<text x="450" y="214" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal" font-style="italic">serial / Bluetooth · TCP · RTT</text>
<text x="450" y="275" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">The firmware does not know which variables are watched: rebuild, reload the symbols, that's all.</text>
</svg>
